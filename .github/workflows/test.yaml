name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # tox 4.67.14 removed tox.config.of_type._PLACE_HOLDER, which
        # tox-gh-actions 3.5.0 imports; lift the pin once it is fixed.
        run: |
          pip install uv "tox<4.67.14" tox-gh-actions tox-uv

      - name: Test with tox
        run: tox